name: Reconstruction CI

on:
  push:
    paths:
      - "src/**"
      - "tools/compare_revisions.py"
      - "analysis/phase-1/**"
      - ".github/workflows/reconstruction-ci.yml"
  pull_request:
    paths:
      - "src/**"
      - "tools/compare_revisions.py"
      - "analysis/phase-1/**"
      - ".github/workflows/reconstruction-ci.yml"

jobs:
  validate-reconstruction:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile Python analysis tooling
        run: python -m compileall -q tools/compare_revisions.py tools/gba_baseline.py tools/inventory_target.py
      - name: Validate legacy date reconstruction
        run: clang -std=c11 -Wall -Wextra -Werror -DSAPPHIRE_DATE_YEAR_LOOP_FIXED=0 -fsyntax-only src/reconstructed/date.c
      - name: Validate fixed date reconstruction
        run: clang -std=c11 -Wall -Wextra -Werror -DSAPPHIRE_DATE_YEAR_LOOP_FIXED=1 -fsyntax-only src/reconstructed/date.c
      - name: Assemble ARM7TDMI boot reconstruction
        run: >-
          clang --target=arm-none-eabi -mcpu=arm7tdmi -x assembler-with-cpp
          -DSAPPHIRE_THUMB_ENTRY=0x0800024D
          -DSAPPHIRE_IRQ_TABLE=0x03001BC0
          -c src/boot/boot_arm.S -o /tmp/boot_arm.o
      - name: Validate Phase 1 JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          paths = [
              Path('manifests/version-inventory.json'),
              Path('manifests/workstreams.json'),
              Path('analysis/phase-1/baseline-summary.json'),
              Path('analysis/phase-1/revision-deltas.json'),
              Path('analysis/phase-1/executable-map.json'),
          ]
          for path in paths:
              json.loads(path.read_text(encoding='utf-8'))
              print(f'validated {path}')
          PY
